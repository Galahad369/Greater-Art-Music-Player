name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  greater-art:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make wrapper executable
        run: chmod +x greater-art/gradlew

      - name: Test, lint, and verification build
        working-directory: greater-art
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon

      - name: Test artifact trust policy
        run: python scripts/test-trust-artifact.py

      - name: Inspect the actual development APK
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' greater-art/app/build.gradle.kts)"
          code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' greater-art/app/build.gradle.kts)"
          python scripts/verify-trust-artifact.py --kind android --artifact greater-art/app/build/outputs/apk/debug/app-debug.apk --channel development --expected-version "$version" --expected-code "$code" --sdk "$ANDROID_HOME"

      # Do not upload Greater Art's CI APK. Clean GitHub runners do not have the
      # established private sideload keystore, so their generated debug signature
      # cannot update an existing personal installation. Distributable APKs must be
      # produced by build-personal-debug.ps1 and pass its pinned certificate check.

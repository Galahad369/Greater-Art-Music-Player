name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  greater-art:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Make wrapper executable
        run: chmod +x greater-art/gradlew

      - name: Test, lint, and verification build
        working-directory: greater-art
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      # Do not upload Greater Art's CI APK. Clean GitHub runners do not have the
      # established private sideload keystore, so their generated debug signature
      # cannot update an existing personal installation. Distributable APKs must be
      # produced by build-personal-debug.ps1 and pass its pinned certificate check.

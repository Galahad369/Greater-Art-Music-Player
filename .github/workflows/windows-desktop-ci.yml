name: Windows Desktop CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate desktop and compile/test native UI
        working-directory: desktop
        shell: pwsh
        run: |
          python packaging/validate_version.py
          python packaging/test_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -classpath ../greater-art/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:compileKotlin :app:test --no-daemon --max-workers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Backend, native bundle and installer gates are separately recorded until
      # reviewed runtime provenance/license approval and clean-host tests exist.

name: Windows Desktop CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate independent desktop identity
        working-directory: desktop
        shell: pwsh
        run: |
          python packaging/validate_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/test_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build pinned offline codec libraries from source
        id: codecs
        shell: pwsh
        run: |
          $vcpkg = (Get-Command vcpkg.exe -ErrorAction SilentlyContinue).Source
          if (-not $vcpkg -and $env:VCPKG_INSTALLATION_ROOT) {
            $candidate = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
            if (Test-Path -LiteralPath $candidate) { $vcpkg = $candidate }
          }
          if (-not $vcpkg) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vs) {
              $candidate = Join-Path $vs 'VC/vcpkg/vcpkg.exe'
              if (Test-Path -LiteralPath $candidate) { $vcpkg = $candidate }
            }
          }
          if (-not $vcpkg) { throw 'Source-build vcpkg tool is unavailable; no unreviewed binary fallback is allowed.' }
          # Hosted runners may ship a shallow/older registry. Fetch only our
          # immutable manifest baseline from the official registry; never float it.
          $baseline = (Get-Content ./desktop/native/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'Invalid pinned codec baseline' }
          $registry = Split-Path $vcpkg
          & git -C $registry fetch --no-tags https://github.com/microsoft/vcpkg.git $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch pinned official codec registry baseline' }
          & git -C $registry cat-file -e "${baseline}:versions/baseline.json"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned codec baseline is missing its registry manifest' }
          # vcpkg reads the versions database from registry HEAD, not just the
          # manifest baseline. Align this disposable hosted checkout as well.
          & git -C $registry checkout --detach $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Unable to align hosted registry HEAD with the pinned baseline' }
          "registry=$registry" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          ./desktop/native/build-codecs.ps1 -VcpkgExe $vcpkg
      - name: Set up the pinned WinUI build SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.300'
      - name: Initialize native Windows CodeQL analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp,csharp
          # The explicit builds below trace both languages. The build-mode input
          # is documented for single-language jobs, so leave it unset here.
          queries: security-extended
      - name: Build Windows-native application
        shell: pwsh
        run: ./desktop/native/build.ps1 -RequireCodecs
      - name: Run native offline core tests
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP ("GreaterArt-native-tests-" + [guid]::NewGuid())
          $app = Join-Path $PWD 'desktop/native/build/GreaterArt.exe'
          function Invoke-NativeSelfTest([string]$directory, [string]$workingDirectory = $PWD.Path) {
            $test = Start-Process $app -ArgumentList "--self-test `"$directory`"" -WorkingDirectory $workingDirectory -WindowStyle Hidden -PassThru
            if (-not $test.WaitForExit(60000)) {
              Stop-Process -Id $test.Id
              throw 'Native self-test timed out'
            }
            return $test.ExitCode
          }
          if ((Invoke-NativeSelfTest $out) -ne 0) { throw 'Native tests failed' }
          Get-Content (Join-Path $out 'unit-tests.txt')
          $existing = New-Item -ItemType Directory -Path "$out-existing"
          $sentinel = Join-Path $existing.FullName 'roundtrip.m3u8'
          Set-Content -LiteralPath $sentinel -Value 'preserve existing playlist'
          $originalHash = (Get-FileHash -LiteralPath $sentinel).Hash
          if ((Invoke-NativeSelfTest $existing.FullName) -ne 2 -or (Get-FileHash -LiteralPath $sentinel).Hash -ne $originalHash -or
              @(Get-ChildItem -LiteralPath $existing.FullName -Force).Count -ne 1) {
            throw 'Self-test did not preserve an existing output directory'
          }
          $relative = "GreaterArt 測試 " + [guid]::NewGuid()
          if ((Invoke-NativeSelfTest $relative $env:RUNNER_TEMP) -ne 0 -or
              -not (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP "$relative/unit-tests.txt") -PathType Leaf)) {
            throw 'Self-test rejected an ordinary relative Unicode output directory'
          }
          $target = New-Item -ItemType Directory -Path "$out-target"
          $junction = New-Item -ItemType Junction -Path "$out-junction" -Target $target.FullName
          if ((Invoke-NativeSelfTest (Join-Path $junction.FullName 'new-output')) -ne 2 -or
              @(Get-ChildItem -LiteralPath $target.FullName -Force).Count -ne 0) {
            throw 'Self-test wrote through a junction parent'
          }
          if ((Invoke-NativeSelfTest ('\\?\' + "$out-device")) -ne 2 -or (Test-Path -LiteralPath "$out-device")) {
            throw 'Self-test accepted a device-prefixed output path'
          }
      - name: Reject malformed native diagnostics before startup
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'desktop/native/build/GreaterArt.exe'
          $scratch = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ('GreaterArt-diagnostic-arity-' + [guid]::NewGuid()))
          $settings = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'GreaterArtDesktopNative'
          if (Test-Path -LiteralPath $settings) { throw 'Expected a fresh native settings directory' }
          $flags = @{
            1 = @('--write-icon', '--self-test', '--verify-stack-output')
            2 = @('--verify-audio', '--verify-stack-audio', '--verify-routing', '--verify', '--verify-ambient',
                  '--verify-ambient-fault', '--verify-visual', '--verify-graph')
          }
          $checks = 0
          foreach ($requiredOperands in $flags.Keys) {
            foreach ($flag in $flags[$requiredOperands]) {
              for ($count = 0; $count -le 4; $count++) {
                if ($count -eq $requiredOperands) { continue }
                $start = [Diagnostics.ProcessStartInfo]::new($app)
                $start.UseShellExecute = $false
                $start.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
                $start.WorkingDirectory = $scratch.FullName
                $start.ArgumentList.Add($flag)
                for ($operand = 0; $operand -lt $count; $operand++) {
                  $start.ArgumentList.Add((Join-Path $scratch.FullName "synthetic operand $operand"))
                }
                $process = [Diagnostics.Process]::Start($start)
                try {
                  if (-not $process.WaitForExit(10000)) {
                    $process.Kill()
                    [void]$process.WaitForExit(5000)
                    throw "Malformed diagnostic timed out ($flag, $count operands)"
                  }
                  if ($process.ExitCode -ne 2) {
                    throw "Malformed diagnostic returned $($process.ExitCode) ($flag, $count operands)"
                  }
                } finally {
                  $process.Dispose()
                }
                $checks++
              }
            }
          }
          if ($checks -ne 44 -or (Test-Path -LiteralPath $settings) -or
              @(Get-ChildItem -LiteralPath $scratch.FullName -Force).Count -ne 0) {
            throw 'Malformed diagnostics entered startup or wrote output'
          }
          Write-Output 'Native diagnostic argument rejection: 44/44 passed.'
      - name: Reject unavailable native diagnostic paths
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'desktop/native/build/GreaterArt.exe'
          $scratch = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ('GreaterArt-stack-negative-' + [guid]::NewGuid()))

          function Invoke-NativeDiagnostic([string[]]$diagnosticArgs) {
            $start = [Diagnostics.ProcessStartInfo]::new($app)
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
            $start.WorkingDirectory = $scratch.FullName
            foreach ($argument in $diagnosticArgs) { $start.ArgumentList.Add($argument) }
            $process = [Diagnostics.Process]::Start($start)
            try {
              if (-not $process.WaitForExit(10000)) {
                if (-not $process.HasExited) { $process.Kill() }
                [void]$process.WaitForExit(5000)
                throw 'Native diagnostic timed out'
              }
              return $process.ExitCode
            } finally {
              $process.Dispose()
            }
          }

          $occupied = New-Item -ItemType Directory -Path (Join-Path $scratch.FullName 'occupied output')
          $sentinel = Join-Path $occupied.FullName 'stack-output-tests.txt'
          Set-Content -LiteralPath $sentinel -Value 'preserve existing Stack report'
          $originalHash = (Get-FileHash -LiteralPath $sentinel).Hash
          # A blocked first WAV stops the checked writer before audio if only the dispatch gate regresses.
          $blockedWave = New-Item -ItemType Directory -Path (Join-Path $occupied.FullName 'output-voice-0.wav')
          if ((Invoke-NativeDiagnostic @('--verify-stack-output', $occupied.FullName)) -ne 2 -or
              (Get-FileHash -LiteralPath $sentinel).Hash -ne $originalHash -or
              @(Get-ChildItem -LiteralPath $occupied.FullName -Force).Count -ne 2 -or
              -not (Test-Path -LiteralPath $blockedWave.FullName -PathType Container) -or
              @(Get-ChildItem -LiteralPath $blockedWave.FullName -Force).Count -ne 0) {
            throw 'Stack diagnostic did not preserve the occupied output directory'
          }

          $missingParent = Join-Path $scratch.FullName 'missing parent'
          if ((Invoke-NativeDiagnostic @('--verify-stack-output', (Join-Path $missingParent 'new-output'))) -ne 2 -or
              (Test-Path -LiteralPath $missingParent)) {
            throw 'Stack diagnostic created an unavailable output parent'
          }
          Write-Output 'Native Stack destination rejection: 2/2 passed.'

          $fixture = Join-Path $scratch.FullName 'synthetic fixture.wav'
          Set-Content -LiteralPath $fixture -Value 'synthetic ordinary file'
          $fixtureHash = (Get-FileHash -LiteralPath $fixture).Hash
          $missingFixture = Join-Path $scratch.FullName 'missing.wav'
          $unusedOutput = Join-Path $scratch.FullName 'unused output'
          $options = @('--verify-audio', '--verify-stack-audio', '--verify-routing', '--verify',
                       '--verify-ambient', '--verify-ambient-fault', '--verify-visual', '--verify-graph')
          foreach ($option in $options) {
              if ((Invoke-NativeDiagnostic @($option, $missingFixture, $unusedOutput)) -ne 2 -or
                  (Test-Path -LiteralPath $unusedOutput)) {
                  throw "Native diagnostic accepted a missing fixture for $option"
              }
              if ((Invoke-NativeDiagnostic @($option, $fixture, $occupied.FullName)) -ne 2 -or
                  (Get-FileHash -LiteralPath $sentinel).Hash -ne $originalHash -or
                  @(Get-ChildItem -LiteralPath $occupied.FullName -Force).Count -ne 2) {
                  throw "Native diagnostic changed an occupied destination for $option"
              }
          }
          if ((Get-FileHash -LiteralPath $fixture).Hash -ne $fixtureHash) {
              throw 'Native diagnostic changed the synthetic fixture'
          }
          Write-Output 'Native media diagnostic path rejection: 16/16 passed.'

          $builtIcon = Join-Path $PWD 'desktop/native/build/app.ico'
          $testIcon = Join-Path $scratch.FullName 'app.ico'
          if ((Invoke-NativeDiagnostic @('--write-icon', 'app.ico')) -ne 0 -or
              -not (Test-Path -LiteralPath $testIcon -PathType Leaf)) {
              throw 'The native icon command did not produce a fresh icon'
          }
          $testIconHash = (Get-FileHash -LiteralPath $testIcon).Hash
          if ($testIconHash -ne (Get-FileHash -LiteralPath $builtIcon).Hash) {
              throw 'The direct icon differs from the icon generated by the build'
          }
          if ((Invoke-NativeDiagnostic @('--write-icon', 'app.ico')) -ne 2 -or
              (Get-FileHash -LiteralPath $testIcon).Hash -ne $testIconHash) {
              throw 'The native icon command did not preserve the occupied icon'
          }
          if ((Invoke-NativeDiagnostic @('--write-icon', 'unused.ico')) -ne 2 -or
              (Test-Path -LiteralPath (Join-Path $scratch.FullName 'unused.ico')) -or
              (Get-FileHash -LiteralPath $testIcon).Hash -ne $testIconHash) {
              throw 'The native icon command accepted an alternate destination'
          }
          Write-Output 'Native icon publication and rejection: 3/3 passed.'
      - name: Prepare existing codec redistribution evidence
        shell: pwsh
        run: ./desktop/native/prepare-codec-package.ps1 -VcpkgRegistry '${{ steps.codecs.outputs.registry }}'
      - name: Build the self-contained WinUI preview
        shell: pwsh
        run: ./desktop/winui/build.ps1 -Publish
      - name: Verify the native graph bridge
        shell: pwsh
        run: ./desktop/winui/test-graph.ps1
      - name: Run graph exploration model tests
        working-directory: desktop/winui
        shell: pwsh
        run: |
          dotnet run --project tests/GraphExploration.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package offline installer if build tools are available
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            Write-Output 'Installer gate not run: WiX 3 build tool is unavailable. No runtime will be downloaded.'
            exit 0
          }
          ./desktop/native/package.ps1 -WixPath (Split-Path $candle.Source) -VcpkgRegistry '${{ steps.codecs.outputs.registry }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $build = Join-Path $PWD 'desktop/native/build'
          $receipt = Get-Content -Raw -LiteralPath (Join-Path $build 'package-receipt.json') | ConvertFrom-Json
          if ($receipt.version -notmatch '^\d+\.\d+\.\d+$' -or $receipt.msiSha256 -notmatch '^[a-f0-9]{64}$' -or $receipt.setupSha256 -notmatch '^[a-f0-9]{64}$') {
            throw 'Installer package receipt is invalid.'
          }
          $setup = Join-Path $build "GreaterArt-Desktop-Setup-$($receipt.version).exe"
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne $receipt.setupSha256) {
            throw 'Setup executable does not match its package receipt.'
          }
          $scratch = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ('GreaterArt-msi-extract-' + [guid]::NewGuid().ToString('N')))
          function Invoke-SetupExtraction([string[]]$destinations, [switch]$obsoleteFolderArgument) {
            $processes = [Collections.Generic.List[Diagnostics.Process]]::new()
            try {
              foreach ($destination in $destinations) {
                $start = [Diagnostics.ProcessStartInfo]::new($setup)
                $start.WorkingDirectory = $destination
                $start.UseShellExecute = $false
                $start.CreateNoWindow = $true
                $start.ArgumentList.Add('--extract-msi')
                if ($obsoleteFolderArgument) { $start.ArgumentList.Add($destination) }
                $processes.Add([Diagnostics.Process]::Start($start))
              }
              foreach ($process in $processes) {
                if (-not $process.WaitForExit(30000)) { throw 'Setup extraction timed out.' }
                $process.ExitCode
              }
            } finally {
              foreach ($process in $processes) {
                if (-not $process.HasExited) {
                  $process.Kill()
                  [void]$process.WaitForExit(5000)
                }
                $process.Dispose()
              }
            }
          }
          function Assert-ExtractedMsi([string]$destination) {
            $msi = Join-Path $destination 'GreaterArt.msi'
            if ((Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash -ne $receipt.msiSha256) {
              throw 'Extracted MSI does not match its package receipt.'
            }
          }
          $fresh = New-Item -ItemType Directory -Path (Join-Path $scratch.FullName 'fresh 測試')
          $freshExit = @(Invoke-SetupExtraction @($fresh.FullName))
          if ($freshExit.Count -ne 1 -or $freshExit[0] -ne 0) { throw 'Fresh Setup extraction failed.' }
          Assert-ExtractedMsi $fresh.FullName
          $shared = New-Item -ItemType Directory -Path (Join-Path $scratch.FullName 'shared output')
          $sharedExits = @(Invoke-SetupExtraction @($shared.FullName, $shared.FullName) | Sort-Object)
          if ($sharedExits.Count -ne 2 -or $sharedExits[0] -ne 0 -or $sharedExits[1] -ne 2) {
            throw 'Concurrent Setup extraction did not produce one success and one refusal.'
          }
          Assert-ExtractedMsi $shared.FullName
          $occupied = New-Item -ItemType Directory -Path (Join-Path $scratch.FullName 'occupied output')
          $sentinel = Join-Path $occupied.FullName 'GreaterArt.msi'
          [IO.File]::WriteAllText($sentinel, 'Synthetic occupied MSI destination')
          $sentinelHash = (Get-FileHash -LiteralPath $sentinel -Algorithm SHA256).Hash
          $occupiedExit = @(Invoke-SetupExtraction @($occupied.FullName))
          if ($occupiedExit.Count -ne 1 -or $occupiedExit[0] -ne 2 -or (Get-FileHash -LiteralPath $sentinel -Algorithm SHA256).Hash -ne $sentinelHash) {
            throw 'Setup extraction failed to preserve an occupied destination.'
          }
          $target = New-Item -ItemType Directory -Path (Join-Path $scratch.FullName 'linked target')
          $child = New-Item -ItemType Directory -Path (Join-Path $target.FullName 'ordinary child')
          $junction = New-Item -ItemType Junction -Path (Join-Path $scratch.FullName 'linked output') -Target $target.FullName
          foreach ($case in @(
            @{ source = $junction.FullName; target = $target.FullName },
            @{ source = (Join-Path $junction.FullName $child.Name); target = $child.FullName }
          )) {
            $linkedExit = @(Invoke-SetupExtraction @($case.source))
            if ($linkedExit.Count -ne 1 -or $linkedExit[0] -ne 2 -or (Test-Path -LiteralPath (Join-Path $case.target 'GreaterArt.msi'))) {
              throw 'Setup extraction followed a linked working directory.'
            }
          }
          $obsolete = New-Item -ItemType Directory -Path (Join-Path $scratch.FullName 'obsolete folder argument')
          $obsoleteExit = @(Invoke-SetupExtraction @($obsolete.FullName) -obsoleteFolderArgument)
          if ($obsoleteExit.Count -ne 1 -or $obsoleteExit[0] -ne 2 -or (Test-Path -LiteralPath (Join-Path $obsolete.FullName 'GreaterArt.msi'))) {
            throw 'Setup extraction did not reject the obsolete folder argument.'
          }
          Write-Output 'Native Setup extraction: 6/6 passed (fresh, concurrent, occupied, junction, linked parent, obsolete argument).'
      - name: Analyze native Windows C++ and C#
        id: native-analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /component:windows-native
      - name: Verify owned source and extraction diagnostics in both CodeQL databases
        shell: pwsh
        env:
          NATIVE_CODEQL_DATABASES: ${{ steps.native-analysis.outputs.db-locations }}
          NATIVE_CODEQL_SARIF: ${{ steps.native-analysis.outputs.sarif-output }}
        run: |
          $DatabaseLocations = $env:NATIVE_CODEQL_DATABASES
          $SarifDirectory = $env:NATIVE_CODEQL_SARIF
          $InstallerExpected = $null -ne (Get-Command candle.exe -ErrorAction SilentlyContinue)
          $ErrorActionPreference = 'Stop'
          $databases = $DatabaseLocations | ConvertFrom-Json -AsHashtable
          if ($databases -isnot [Collections.IDictionary]) { throw 'CodeQL database locations must be a map.' }
          $expected = @{
              cpp = @('desktop/native/App.cpp', 'desktop/winui/NativeBridge.cpp', 'desktop/winui/GraphBridge.cpp')
              csharp = @('desktop/winui/Engine.cs', 'desktop/winui/MainWindow.xaml.cs', 'desktop/winui/GraphExploration.cs')
          }
          $diagnosticFailures = [Collections.Generic.List[string]]::new()
          foreach ($language in @('cpp', 'csharp')) {
              if (-not $databases.Contains($language) -or [string]::IsNullOrWhiteSpace($databases[$language])) {
                  throw "Missing CodeQL database location: $language"
              }
              $archive = [IO.Compression.ZipFile]::OpenRead((Join-Path $databases[$language] 'src.zip'))
              try {
                  foreach ($required in $expected[$language]) {
                      $matches = @($archive.Entries | Where-Object {
                          $name = $_.FullName.Replace('\', '/')
                          $_.Length -gt 0 -and ($name -eq $required -or $name.EndsWith('/' + $required, [StringComparison]::OrdinalIgnoreCase))
                      })
                      if ($matches.Count -eq 0) { throw "CodeQL $language source archive is missing owned source: $required" }
                      Write-Output "CodeQL $language owned source present: $required"
                  }
                  if ($language -eq 'cpp') {
                      $installerSource = @($archive.Entries | Where-Object {
                          $name = $_.FullName.Replace('\', '/')
                          $_.Length -gt 0 -and ($name -eq 'desktop/native/Setup.cpp' -or $name.EndsWith('/desktop/native/Setup.cpp', [StringComparison]::OrdinalIgnoreCase))
                      })
                      if ($installerSource.Count -gt 0) {
                          Write-Output 'CodeQL cpp optional installer source present: desktop/native/Setup.cpp'
                      } elseif ($InstallerExpected) {
                          throw 'CodeQL cpp source archive is missing the built installer source: desktop/native/Setup.cpp'
                      } else {
                          Write-Output 'CodeQL cpp optional installer source UNVERIFIED: WiX 3 was unavailable; installer compilation was not required.'
                      }
                  }
                  Write-Output "CodeQL $language source archive entries: $($archive.Entries.Count)"
              } finally {
                  $archive.Dispose()
              }
              $sarif = Get-Content -LiteralPath (Join-Path $SarifDirectory "$language.sarif") -Raw | ConvertFrom-Json -AsHashtable
              if ($sarif -isnot [Collections.IDictionary] -or $sarif['version'] -ne '2.1.0' -or -not $sarif['runs']) {
                  throw "Invalid CodeQL $language SARIF metadata."
              }
              $notices = @(
                  foreach ($run in $sarif['runs']) {
                      if ($run -isnot [Collections.IDictionary]) { throw "Invalid CodeQL $language SARIF run metadata." }
                      foreach ($invocation in $run['invocations']) {
                          @($invocation['toolExecutionNotifications']) + @($invocation['toolConfigurationNotifications']) | Where-Object { $null -ne $_ }
                      }
                  }
              )
              Write-Output "CodeQL $language diagnostic notifications: $($notices.Count)"
              foreach ($notice in $notices) {
                  if ($notice -isnot [Collections.IDictionary]) { throw "Invalid CodeQL $language diagnostic metadata." }
                  $level = if ($notice['level']) { [string]$notice['level'] } else { 'warning' }
                  if ($level -notin @('none', 'note', 'warning', 'error')) { throw "Invalid CodeQL $language diagnostic level." }
                  $id = if ($notice['descriptor'] -and $notice['descriptor']['id']) { [string]$notice['descriptor']['id'] } else { '<unspecified>' }
                  $message = ([string]$notice['message']['text']).Replace("`r", ' ').Replace("`n", ' ')
                  Write-Output "CodeQL $language diagnostic [$level] [$id]: $message"
                  if ($level -in @('error', 'warning')) { $diagnosticFailures.Add("$language/$id") }
              }
          }
          if ($diagnosticFailures.Count -gt 0) {
              throw ('CodeQL extraction/configuration diagnostics require review: ' + ($diagnosticFailures -join ', '))
          }
      # Interactive media/installer acceptance remains a local Windows gate.

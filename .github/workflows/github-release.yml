name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag resolves to checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

      - name: Verify release tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]] || { echo "Release tag must start with v"; exit 1; }
          expected_version="${RELEASE_TAG#v}"
          source_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' greater-art/app/build.gradle.kts)"
          test -n "$source_version"
          if [ "$source_version" != "$expected_version" ]; then
            echo "Tag/app version mismatch: tag=$expected_version Gradle=$source_version"
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_B64:?Missing ANDROID_RELEASE_KEYSTORE_B64 secret}"
          : "${ANDROID_RELEASE_STORE_PASSWORD:?Missing ANDROID_RELEASE_STORE_PASSWORD secret}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?Missing ANDROID_RELEASE_KEY_ALIAS secret}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?Missing ANDROID_RELEASE_KEY_PASSWORD secret}"
          keyfile="$RUNNER_TEMP/greater-art-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          echo "ANDROID_RELEASE_KEYSTORE=$keyfile" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build and verify tagged source
        working-directory: greater-art
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Enforce production trust gate
        shell: bash
        env:
          EXPECTED_CERTIFICATE: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${EXPECTED_CERTIFICATE:?Owner must approve ANDROID_RELEASE_CERT_SHA256 before production publishing}"
          code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' greater-art/app/build.gradle.kts)"
          python scripts/verify-trust-artifact.py --kind android --artifact greater-art/app/build/outputs/apk/release/app-release.apk --channel production --expected-version "${RELEASE_TAG#v}" --expected-code "$code" --expected-certificate "$EXPECTED_CERTIFICATE" --sdk "$ANDROID_HOME" --output GreaterArt-trust.json

      - name: Verify APK identity, signature, and packaged version
        shell: bash
        run: |
          set -euo pipefail
          apk="greater-art/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"

          expected_version="${RELEASE_TAG#v}"
          expected_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' greater-art/app/build.gradle.kts)"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          packaged_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          packaged_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          packaged_version="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"

          test -n "$expected_code"
          test -n "$packaged_name"
          test -n "$packaged_code"
          test -n "$packaged_version"
          if [ "$packaged_name" != "com.local.listentomusic" ]; then
            echo "Unexpected APK package: $packaged_name"
            exit 1
          fi
          if [ "$packaged_version" != "$expected_version" ]; then
            echo "Tag/APK version mismatch: tag=$expected_version APK=$packaged_version"
            exit 1
          fi
          if [ "$packaged_code" != "$expected_code" ]; then
            echo "Gradle/APK versionCode mismatch: Gradle=$expected_code APK=$packaged_code"
            exit 1
          fi

      - name: Prepare versioned artifact and checksum
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          src="greater-art/app/build/outputs/apk/release/app-release.apk"
          version="${RELEASE_TAG#v}"
          apk="GreaterArt-${version}.apk"
          checksum="${apk}.sha256"
          test -f "$src"
          cp "$src" "$apk"
          sha256sum "$apk" > "$checksum"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Record resolved build dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash greater-art/gradlew -p greater-art :app:dependencies --configuration releaseRuntimeClasspath --console=plain --quiet > "$RUNNER_TEMP/greater-art-dependencies.txt"
          python scripts/trust-dependency-inventory.py --kind android --gradle-report "$RUNNER_TEMP/greater-art-dependencies.txt" --output GreaterArt-dependencies.json

      - name: Attest exact candidate bytes before publication
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.asset.outputs.apk }}
            GreaterArt-trust.json
            GreaterArt-dependencies.json

      - name: Create release from verified signed tag build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "${{ steps.asset.outputs.apk }}" \
            "${{ steps.asset.outputs.checksum }}" \
            "GreaterArt-trust.json" \
            "GreaterArt-dependencies.json" \
            --verify-tag \
            --title "Greater Art ${RELEASE_TAG}" \
            --notes "Built and release-signed in GitHub Actions from the exact tagged source. SHA-256 is attached for integrity verification."
